version: 2
updates:
  - package-ecosystem: docker
    directory: /.github/ci
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  # The C and C++ dependencies are fetched by CMake at pinned hashes, which Dependabot cannot read.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
