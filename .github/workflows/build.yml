name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      baseline:
        description: Install the toolchains on the runner for comparison
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # No runner has the game: every source is compiled, the runtime is not
  # linked, and the tests that read no retail data run. See build.sh.
  DISRUPTOR_WITHOUT_GAME: "1"
  DISRUPTOR_COMPILER_LAUNCHER: ccache
  # ccache keeps SDL's precompiled header, and the 260 to 320 files behind it, only under these two.
  CCACHE_SLOPPINESS: pch_defines,time_macros
  CCACHE_MAXSIZE: 200M

jobs:
  linux:
    name: Linux, GCC
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux dependencies on the runner
        if: inputs.baseline
        run: |
          sudo apt-get update
          sudo xargs -a .github/ci/linux-packages.txt apt-get install --yes --no-install-recommends
      - name: Cache the Linux build image
        if: ${{ !inputs.baseline }}
        id: image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/disruptor-ci.tar
          key: ubuntu-24.04-x64-${{ hashFiles('.github/ci/Dockerfile', '.github/ci/linux-packages.txt') }}
      - name: Prepare the Linux build image
        if: ${{ !inputs.baseline }}
        env:
          RESTORED: ${{ steps.image.outputs.cache-hit }}
        run: |
          if [[ "$RESTORED" == true ]]; then
            docker load -i "$RUNNER_TEMP/disruptor-ci.tar"
          else
            docker build -t disruptor-ci:noble .github/ci
            docker save -o "$RUNNER_TEMP/disruptor-ci.tar" disruptor-ci:noble
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-linux-${{ inputs.baseline && 'host' || 'image' }}-${{ github.sha }}
          restore-keys: ccache-linux-${{ inputs.baseline && 'host' || 'image' }}-
      - name: Build and test without the game
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          BASELINE: ${{ inputs.baseline }}
        run: |
          if [[ "$BASELINE" == true ]]; then
            sh .github/ci/build.sh
          else
            mkdir -p "$CCACHE_DIR"
            docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work -v "$CCACHE_DIR:/ccache" \
              -e HOME=/tmp -e CCACHE_DIR=/ccache -e CCACHE_MAXSIZE -e CCACHE_SLOPPINESS \
              -e DISRUPTOR_COMPILER_LAUNCHER -e DISRUPTOR_WITHOUT_GAME disruptor-ci:noble \
              sh .github/ci/build.sh
          fi
      - name: Check the Python tools and tests with ruff
        if: ${{ !cancelled() }}
        run: |
          python3 -m venv "$RUNNER_TEMP/ruff"
          echo "ruff==0.17.2 --hash=sha256:c60f93fec7142dba5b8f487f94bf2f6231dae24dc11e4c48648347c8b0720004" > "$RUNNER_TEMP/ruff.txt"
          "$RUNNER_TEMP/ruff/bin/pip" install --quiet --no-deps --require-hashes -r "$RUNNER_TEMP/ruff.txt"
          "$RUNNER_TEMP/ruff/bin/ruff" check .
          "$RUNNER_TEMP/ruff/bin/ruff" format --check .

  mingw:
    name: Windows, MinGW-w64
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CC: gcc
      CXX: g++
      CCACHE_COMPILERTYPE: gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        if: inputs.baseline
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
      - name: Prepare runner MinGW-w64 and ccache
        if: ${{ !inputs.baseline }}
        shell: pwsh
        run: ./.github/ci/windows-tools.ps1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-mingw-${{ inputs.baseline && 'msys' || 'runner' }}-${{ github.sha }}
          restore-keys: ccache-mingw-${{ inputs.baseline && 'msys' || 'runner' }}-
      - name: Build and test without the game
        if: ${{ !inputs.baseline }}
        shell: bash
        run: sh .github/ci/build.sh
      - name: Build and test with MSYS2
        if: inputs.baseline
        shell: msys2 {0}
        run: sh .github/ci/build.sh
