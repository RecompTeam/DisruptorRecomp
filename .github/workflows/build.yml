name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # No runner has the game: every source is compiled, the runtime is not
  # linked, and the tests that read no retail data run. See build.sh.
  DISRUPTOR_WITHOUT_GAME: "1"
  DISRUPTOR_COMPILER_LAUNCHER: ccache
  # ccache keeps SDL's precompiled header, and the 260 to 320 files behind it, only under these two.
  CCACHE_SLOPPINESS: pch_defines,time_macros
  CCACHE_MAXSIZE: 200M

jobs:
  linux:
    name: Linux, GCC
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain and what SDL builds against
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential ccache cmake ninja-build pkg-config python3 python3-venv \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxinerama-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libdrm-dev \
            libgbm-dev libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libudev-dev libdbus-1-dev libibus-1.0-dev liburing-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-
      - name: Build and test without the game
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          ccache --zero-stats
          ./build.sh
          ccache --show-stats
      - name: Check the Python tools and tests with ruff
        if: ${{ !cancelled() }}
        run: |
          python3 -m venv "$RUNNER_TEMP/ruff"
          echo "ruff==0.17.2 --hash=sha256:c60f93fec7142dba5b8f487f94bf2f6231dae24dc11e4c48648347c8b0720004" > "$RUNNER_TEMP/ruff.txt"
          "$RUNNER_TEMP/ruff/bin/pip" install --quiet --no-deps --require-hashes -r "$RUNNER_TEMP/ruff.txt"
          "$RUNNER_TEMP/ruff/bin/ruff" check .
          "$RUNNER_TEMP/ruff/bin/ruff" format --check .

  mingw:
    name: Windows, MinGW-w64
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-mingw-${{ github.sha }}
          restore-keys: ccache-mingw-
      - name: Build and test without the game
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
          # MSYS2's cc.exe is no name ccache knows: unnamed, it rebuilt the precompiled header on every run.
          CCACHE_COMPILERTYPE: gcc
        run: |
          ccache --zero-stats
          ./build.sh
          ccache --show-stats
