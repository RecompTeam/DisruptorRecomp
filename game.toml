[game]
name = "Disruptor"
id = "SLUS-00224"
exe = "input/SLUS_002.24.code"
disc = "input/Disruptor (USA).cue"
load_address = "0x80011200"
entry_pc = "0x80048CE4"
text_size = "0x00045738"
stack_base = "0x801FFFF0"

[recompiler]
seeds = "seeds/functions.txt"
bios_config = "psxrecomp/bios/OpenBIOS.toml"
out_dir = "generated"
out_stem = "SLUS_002.24.code"
strict = true
discovery = "whole-image"
mod_function_entry_funcs = ["0x80011888", "0x8001A46C", "0x8001C484", "0x80020DD8", "0x80032514", "0x80039450", "0x8003B78C", "0x80040E68", "0x800429DC", "0x80044A10", "0x80044BDC", "0x80046134", "0x8004B3D4", "0x8004D348", "0x8004D410"]

# The gameplay loop presents only when two VBlanks have elapsed, although its
# simulation already steps once per VBlank. Drop the constant floor here; the
# VSync entry hook (0x8004B3D4) restores it unless the host unlocks 60 FPS.
[[recompiler.patch]]
id = "disruptor-gameplay-frame-floor"
address = "0x80043E90"
expected = "0x28420002"
replacement = "0x28420001"

# Calls made after an instruction of the game that ran from RAM. A site is an address and the whole
# instruction word expected there. Native code gets the same calls from the generator's own lists, which
# a contract keeps equal to these.

# Disruptor has no architectural pitch state.  The project implements its
# opt-in vertical camera at a deliberately finite set of resident instruction
# sites: CPU-projected screen-Y centres, proven vertical participation tests,
# the two projectile-construction convergence points, and the common renderer
# epilogue.  Every complete instruction word is pinned so a different retail
# revision fails generation instead of silently modifying unrelated code.
#
# The generated callback is appended after the vanilla instruction.  At zero
# pitch it is an exact no-op; the runtime callback decodes the pinned word to
# identify the destination register or the required post-instruction action.
[[recompiler.instruction_hook]]
callback = "disruptor_vertical_camera_instruction_hook"
sites = [
    # CPU world projection centres (ORI rt,zero,120).
    ["0x8003AD54", "0x34020078"],
    ["0x8003ADE4", "0x34020078"],
    ["0x8003B140", "0x34020078"],
    ["0x8003B1EC", "0x34020078"],
    ["0x8003B764", "0x34020078"],
    ["0x8003B990", "0x34020078"],
    ["0x8003BDA4", "0x34020078"],
    ["0x8003C4B4", "0x34020078"],
    ["0x8003C99C", "0x34020078"],
    ["0x8003D07C", "0x34020078"],
    ["0x8003D398", "0x34030078"],
    ["0x8003F6B0", "0x34020078"],
    # Proven camera-vertical object participation pairs.
    ["0x8003B900", "0x0205102A"],
    ["0x8003B90C", "0x0202102A"],
    ["0x8003BD14", "0x0206102A"],
    ["0x8003BD20", "0x0202102A"],
    ["0x8003CDB8", "0x0065102A"],
    ["0x8003CDC4", "0x0062102A"],
    # Normal-weapon and psionic construction convergence loads.
    ["0x8002E4B8", "0x92640022"],
    ["0x8002EAF0", "0x92430020"],
    # Common renderer epilogue: restore the neutral projection horizon.
    ["0x8004279C", "0x8FBF016C"],
]

# Disruptor's experimental far-rendering override is host-only: reviewed
# loads of the retail far/fade globals are substituted after the original LW,
# leaving guest RAM untouched.  Additional reviewed portal, object-decision,
# and packet-boundary instructions feed read-only diagnostics through the same
# callback.  The renderer entry starts a measurement span and the reviewed
# common epilogue closes it.  Keep this callback independent from the
# vertical-camera dispatcher so either enhancement can be built and tested in
# isolation.
[[recompiler.instruction_hook]]
callback = "disruptor_far_rendering_instruction_hook"
sites = [
    # Portal traversal diagnostics: recursion depth, unique-room completion,
    # and the three candidate-distance values before their branch tests.
    ["0x8003A0F8", "0x93B300C0"],
    ["0x8003A390", "0xA082001F"],
    ["0x8003A92C", "0x00005812"],
    ["0x8003A964", "0x00681021"],
    ["0x8003AA74", "0x00AC1021"],
    # Far-distance loads from $gp + 0x4A0.
    ["0x8003A914", "0x8F8C04A0"],
    ["0x8003B8C8", "0x8F8304A0"],
    ["0x8003BCE0", "0x8F8204A0"],
    ["0x8003C168", "0x8F8304A0"],
    ["0x8003CD64", "0x8F8304A0"],
    # Object distance-decision results.
    ["0x8003B8D8", "0x0072182A"],
    ["0x8003BCEC", "0x0053102A"],
    ["0x8003C178", "0x0077182A"],
    ["0x8003CD70", "0x0077182A"],
    # Fade-start loads from $gp + 0x494.
    ["0x8003B2CC", "0x8F820494"],
    ["0x8003BA30", "0x8F820494"],
    ["0x8003BE40", "0x8F820494"],
    ["0x8003C628", "0x8F820494"],
    ["0x8003C878", "0x8F820494"],
    ["0x8003D28C", "0x8F820494"],
    ["0x8003FB0C", "0x8F840494"],
    # Billboard post-pass CLUT-row selection.
    ["0x80043184", "0x8F820494"],
    # Main-renderer visible-list and packet boundaries.
    ["0x800410E0", "0x93830310"],
    ["0x800410F8", "0x8F820680"],
    ["0x800411D8", "0x8F8301D4"],
    # Common renderer epilogue.
    ["0x8004279C", "0x8FBF016C"],
]

# Disruptor's world actors and pickups are CPU-built POLY_FT4 billboards.
# Their projected centre goes through the reviewed classic-wide X squash, but
# their retail pixel width does not.  These are five final packet writes plus
# the deferred base-actor submission seam; the host callback tags only a
# completed, shape-validated packet for proportion repair.
[[recompiler.instruction_hook]]
callback = "disruptor_billboard_aspect_instruction_hook"
sites = [
    ["0x8003BB88", "0xA6030016"],
    ["0x8003BFB0", "0xA6030016"],
    ["0x8003C848", "0xA6030016"],
    ["0x8003CAD4", "0xA6020016"],
    ["0x8003D488", "0xA2060025"],
    ["0x800433A0", "0x02A02821"],
]

# Disruptor's sky backdrop routine lays SPRT tiles over the opening it has
# already clamped to the 320-pixel frame.  These four seams hand the host the
# left edge, the panorama scroll and the right edge before the tile loop reads
# them, so classic widescreen can ask for the columns a wider view needs.
[[recompiler.instruction_hook]]
callback = "disruptor_backdrop_tiles_instruction_hook"
sites = [
    ["0x8003B328", "0x8FB80040"],
    ["0x8003B338", "0x00621821"],
    ["0x8003B348", "0x8FB80028"],
    ["0x8003B5A8", "0x8F8205B8"],
    ["0x8003B638", "0x8FB80040"],
]

# Disruptor's sky backdrop routine lays SPRT tiles over the opening it has
# already clamped to the 320-pixel frame.  These four seams hand the host the
# left edge, the panorama scroll and the right edge before the tile loop reads
# them, so classic widescreen can ask for the columns a wider view needs.
[[recompiler.instruction_hook]]
callback = "disruptor_sprite_depth_instruction_hook"
sites = [
    ["0x8003B98C", "0xAFA20010"],
    ["0x8003BDA0", "0xAFA20010"],
    ["0x8003C4B0", "0xAFA20010"],
    ["0x8003D078", "0xAFA20010"],
    ["0x8003D1B4", "0xA4379EA0"],
]

# Disruptor's sky backdrop routine lays SPRT tiles over the opening it has
# already clamped to the 320-pixel frame.  These four seams hand the host the
# left edge, the panorama scroll and the right edge before the tile loop reads
# them, so classic widescreen can ask for the columns a wider view needs.
[[recompiler.instruction_hook]]
callback = "disruptor_intro_skip_instruction_hook"
sites = [
    ["0x800147B0", "0x2A820003"],
    ["0x80020A80", "0x2A02005E"],
    ["0x80048678", "0x30420940"],
]

[runtime]
debug_port = 4624
window_title = "Disruptor Recompiled"
memcard_dir = "saves"
disc_speed = "1x"
bios_hle = false
overlay_cache = true
overlay_backend = "auto"

[video]
aspect_ratio = "4:3"
renderer = "opengl"
supersampling = 4
antialiasing = true
texture_filtering = "nearest"
# The movies fill all 320 columns, the framework's default blanks the last 8.
depth24_trailing_margin = 0

[controller]
default_mode = "digital"
# A connected gamepad plays beside the keyboard and mouse.
p1_device = "keyboard+gamepad"
allow_hybrid = false
lock_mode = true

# The shipped default remains authentic 4:3.  The same generated executable
# can select 16:9 at launch: every cull helper below is an identity at 4:3.
[widescreen]
gte_game_mode = true
native_wide = false
hud_sprt_squash = true
nw_hud_corners = false
offer = true
offer_ultrawide = true
adaptive_view = true

# After projection the fourth funnel keeps a sprite only when it reaches 20 pixels into the picture,
# the margin a television hid. A wide picture shows it, so both bounds move out by the picture's margin.
[widescreen.cull]
slti_sites = ["0x8003D0F8", "0x8003D110"]
slti_lower_sites = ["0x8003D108", "0x8003D118"]

# Disruptor seeds portal traversal with two eight-bit yaw rays at +/-32 units
# (a 45-degree 4:3 half-FOV). Widen only those signed offsets for the live
# aspect; keep every downstream unsigned 0..320 portal span intact.
[[widescreen.cull.yaw_cone]]
address = "0x80040FE8"
expected = "0x24710020"
full_turn = 256

[[widescreen.cull.yaw_cone]]
address = "0x80040FF0"
expected = "0x2472FFE0"
full_turn = 256

# The four funnels that list world objects and sprites repeat the 45-degree horizontal
# side-plane test after traversal. Their adjacent vertical tests remain vanilla.
[[widescreen.cull.horizontal_slt]]
address = "0x8003B8EC"
expected = "0x0067102A"

[[widescreen.cull.horizontal_slt]]
address = "0x8003B8F8"
expected = "0x0062102A"

[[widescreen.cull.horizontal_slt]]
address = "0x8003BD00"
expected = "0x0067102A"

[[widescreen.cull.horizontal_slt]]
address = "0x8003BD0C"
expected = "0x0062102A"

[[widescreen.cull.horizontal_slt]]
address = "0x8003C194"
expected = "0x02A9102A"

[[widescreen.cull.horizontal_slt]]
address = "0x8003C1A0"
expected = "0x02A2102A"

[[widescreen.cull.horizontal_slt]]
address = "0x8003CDA4"
expected = "0x0068102A"

[[widescreen.cull.horizontal_slt]]
address = "0x8003CDB0"
expected = "0x0062102A"

# Disruptor's static-world portal renderer assumes every clip span remains in
# its original unsigned 0..320 range.  Native-wide negative spans caused the
# yaw-dependent world disappearance seen in Modernisation Tests 4-6.  Classic
# projection-and-stretch keeps those invariants intact: the GTE handles normal
# 3D, while these exact final-X sites apply the same 3/4 projection squash to
# the game's CPU-projected portals, billboards, and point effects.  At 4:3 the
# helper is an exact identity.
[widescreen.backdrop]
x_sites = [
    "0x8003A578", "0x8003A650", "0x8003B244", "0x8003B2A0",
    "0x8003B988", "0x8003BD9C", "0x8003C4AC", "0x8003D074",
    "0x8003F6B4",
]
# Diagnostic candidate for the static-room renderer used near the affected
# skyline. The runtime keeps this scope disabled by default; its depth gate can
# be enabled session-only to test whether far GTE-projected meshes need to keep
# their authored 4:3 coverage before the final wide stretch.
unsquash_funcs = ["0x8003A0F0"]

[audit]
[[audit.regions]]
name = "Main executable"
rom_start = "0x800"
rom_end = "0x45F38"
vaddr_base = "0x80011200"

[audit.normalize]
kseg_mask = "0x1FFFFFFF"
